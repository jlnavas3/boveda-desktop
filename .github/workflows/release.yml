name: Release Bóveda Local Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-binaries:
    name: Compilar para ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            binary_name: boveda-gui
            artifact_name: boveda-desktop-linux-x86_64
            archive_format: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: boveda-gui.exe
            artifact_name: boveda-desktop-windows-x86_64
            archive_format: zip

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Instalar dependencias del sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libsecret-1-dev

      - name: Configurar toolchain de Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Compilar binario release
        run: cargo build --release --bin boveda-gui --target ${{ matrix.target }}

      - name: Empaquetar Linux (tar.gz)
        if: matrix.archive_format == 'tar.gz'
        shell: bash
        run: |
          mkdir -p staging
          cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} staging/boveda-gui
          chmod +x staging/boveda-gui
          cp README.md LICENSE staging/
          cd staging
          tar -czf ../${{ matrix.artifact_name }}.tar.gz *
          cd ..
          sha256sum ${{ matrix.artifact_name }}.tar.gz > ${{ matrix.artifact_name }}.tar.gz.sha256

      - name: Empaquetar Windows (zip)
        if: matrix.archive_format == 'zip'
        shell: bash
        run: |
          mkdir -p staging
          cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} staging/
          cp README.md LICENSE staging/
          cd staging
          7z a ../${{ matrix.artifact_name }}.zip *
          cd ..
          sha256sum ${{ matrix.artifact_name }}.zip > ${{ matrix.artifact_name }}.zip.sha256

      - name: Subir artefacto temporal
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_name }}.${{ matrix.archive_format }}
            ${{ matrix.artifact_name }}.${{ matrix.archive_format }}.sha256

  publish-github-release:
    name: Publicar GitHub Release
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Descargar todos los binarios compilados
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Crear Release y adjuntar binarios
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          name: Bóveda Local Desktop ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
